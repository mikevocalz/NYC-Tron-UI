# XcodeGen spec for the launcher capture UI test. CI only; not shipped.
# The host app is a placeholder XCUITest needs; it is installed first and
# shows on the Home Screen as "Probe".
name: LauncherCapture
options:
  bundleIdPrefix: org.nyctron.launchercapture
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: "YES"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Probe:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nyctron.launchercapture.probe
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Probe
  LauncherCaptureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Probe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nyctron.launchercapture.uitests
        TEST_TARGET_NAME: Probe
schemes:
  LauncherCaptureUITests:
    build:
      targets:
        Probe: all
        LauncherCaptureUITests: [test]
    test:
      targets: [LauncherCaptureUITests]
