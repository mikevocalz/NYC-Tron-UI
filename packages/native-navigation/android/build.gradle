buildscript {
  repositories { mavenCentral() }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:$kotlinVersion")
  }
}
apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'com.nyctron'
version = '0.1.0'

android {
  namespace "com.nyctron.navigation"
  defaultConfig { versionCode 1; versionName "0.1.0" }
  buildFeatures { compose true }
}
def expoUiPackage = new File(rootProject.projectDir, "../node_modules/@expo/ui")
if (!expoUiPackage.isDirectory()) {
  throw new GradleException("Install @expo/ui in host before building native NYC-Tron navigation")
}
def expoUiManifest = new groovy.json.JsonSlurper().parse(new File(expoUiPackage, "package.json"))
repositories {
  maven { url uri(new File(expoUiPackage, "android/local-maven-repo")) }
}
dependencies {
  implementation "expo.modules.ui:expo.modules.ui:${expoUiManifest.version}"
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.compose.foundation:foundation-android:1.12.1'
  implementation 'androidx.compose.ui:ui-android:1.12.1'
  implementation 'androidx.compose.material3:material3-android:1.5.0-beta01'
}
