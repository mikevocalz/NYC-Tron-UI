plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.nyctron'
version = '0.1.0'

/*
 * Expo Modules 2. The hook's "changed" listener takes the region list as a
 * bare array, and only a v2 @Event can emit one: the legacy ModuleDefinition
 * bridge emits Map bodies only. `v2 true` applies the io.github.expo.modules.v2
 * compiler plugin; the runtime (io.github.expo:expo-modules-v2-react) comes
 * through expo-modules-core 58's own api(...) dependency.
 *
 * The class stays out of "android.modules" in expo-module.config.json. That
 * list feeds the legacy ExpoModulesPackageList, which expects
 * expo.modules.kotlin.modules.Module; v2 modules are found by the compiler
 * plugin through ExpoModulesV2ModuleList.
 */
expoModule {
  canBePublished false
  v2 true
}

android {
  namespace "com.nyctron.reservedregions"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // LifecycleEventListener; Gradle resolves the host app's react-android.
  implementation 'com.facebook.react:react-android'
  // WindowInfoTracker / FoldingFeature.
  implementation "androidx.window:window:1.5.1"
}
