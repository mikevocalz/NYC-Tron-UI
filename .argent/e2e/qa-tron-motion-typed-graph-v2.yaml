steps:
  - launch: com.nyctron.instruments.example
  - await: { visible: { text: Search assets }, timeout: 15000 }
  - await: { idle: true }
  - tap: { text: motion }
  - await: { visible: { text: Motion component } }
  - await: { idle: true }
  - tap: { id: motion-component }
  - await: { exists: { text: Graph } }
  - await: { idle: true }
  - scroll-to: { target: { text: Graph, within: { id: motion-component-list } }, direction: down }
  - await: { idle: true }
  - tap: { text: Graph, within: { id: motion-component-list } }
  - await: { visible: { text: Node graph panel section } }
  - await: { idle: true }
  - tap: { text: Ports }
  - await: { visible: { text: 'Select an output, then an input' } }
  - await: { text: { in: { text: Motion node graph state }, contains: '"commits":0' } }
  - await: { idle: true }
  - tap: { text: 'Select output Time: Output (float)' }
  - await: { visible: { text: 'Connecting time:out' } }
  - await: { idle: true }
  - tap: { text: 'Connect input Scale: Input (float)' }
  - await: { text: { in: { text: Motion node graph state }, contains: '"commits":1' } }
  - await: { text: { in: { text: Motion node graph state }, contains: '"from":{"nodeId":"time","portId":"out"}' } }
  - await: { text: { in: { text: Motion node graph state }, contains: '"to":{"nodeId":"scale","portId":"in"}' } }
  - await: { idle: true }
  - tap: { text: 'Select output Time: Output (float)' }
  - await: { visible: { text: 'Connecting time:out' } }
  - await: { idle: true }
  - tap: { text: 'Connect input Scale: Input (float)' }
  - await: { visible: { text: This graph connection already exists } }
  - await: { text: { in: { text: Motion node graph state }, contains: '"commits":1' } }
  - await: { idle: true }
