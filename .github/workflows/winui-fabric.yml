name: WinUI 3 navigation and native desktop in RNW Fabric

on:
  pull_request:
    paths:
      - "packages/windows-fluent/**"
      - "packages/core/**"
      - "packages/ui/**"
      - "tooling/desktop-lane/**"
      - "tooling/api-signatures.mjs"
      - "tooling/pack-release.mjs"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "docs/api-signatures-windows.json"
      - ".github/workflows/winui-fabric.yml"
      - "tooling/app-identity/capture/**"
  push:
    branches:
      - "feat/winui-fabric-xaml-navigation-20261105"
    paths:
      - "packages/windows-fluent/**"
      - "packages/core/**"
      - "tooling/api-signatures.mjs"
      - "tooling/pack-release.mjs"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "docs/api-signatures-windows.json"
      - ".github/workflows/winui-fabric.yml"
      - "tooling/app-identity/capture/**"
  workflow_dispatch:
  # The release requires the actual Windows executable and UIA roundtrip.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: winui-fabric-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Fabric codegen and source gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Validate actual XAML Fabric native bridge sources
        run: node --test packages/windows-fluent/rnw-fabric/tests/*.test.mjs
      - name: Install isolated RNW 0.85 dependencies
        working-directory: packages/windows-fluent/rnw-fabric
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build peer-free shared contracts
        working-directory: packages/windows-fluent/rnw-fabric
        run: node scripts/build-peers.mjs
      - name: Validate Windows-only TypeScript
        working-directory: packages/windows-fluent/rnw-fabric
        run: npm run typecheck
      - name: Build dist and check the release tarball
        working-directory: packages/windows-fluent/rnw-fabric
        run: |
          npm run build
          npm test
          listing=$(npm pack --dry-run --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].files.map(f=>f.path).join("\n")))')
          for f in dist/index.js dist/index.d.ts src/TronNavigationViewNativeComponent.ts src/TronOverlayAnchorNativeComponent.ts src/TronDragSurfaceNativeComponent.ts dist/overlays.windows.js dist/drag-drop.windows.js windows/NYCTronFluentFabric/TronNavigationView.cpp windows/NYCTronFluentFabric/TronOverlayAnchor.cpp windows/NYCTronFluentFabric/TronDragSurface.cpp windows/NYCTronFluentFabric/NativeDragBroker.cpp react-native.config.js README.md THIRD_PARTY_NOTICES.md; do
            echo "$listing" | grep -qx "$f" || { echo "Missing $f in windows-fluent-fabric pack"; exit 1; }
          done
      - name: Verify the isolated RNW public declaration snapshot
        run: node tooling/api-signatures.mjs --package packages/windows-fluent/rnw-fabric --snapshot docs/api-signatures-windows.json
      - name: Build canonical shared release packages with the root compiler
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts
          corepack pnpm --filter @nyc-tron/core --filter @nyc-tron/windows-fluent build
          node tooling/pack-release.mjs "$RUNNER_TEMP/windows-shared" --packages core,windows-fluent
      - name: Retain canonical shared archives for the native consumer
        uses: actions/upload-artifact@v4
        with:
          name: windows-fabric-shared-packages
          path: ${{ runner.temp }}/windows-shared
          if-no-files-found: error
      # RNW 'codegen-windows' invokes dotnet.exe and Windows-only tools.
      # Keep the Linux lane to TS/source checks; generate C++ on Windows.

  native:
    name: VS 2026 RNW 0.85 XAML Fabric native C++ compile
    needs: contracts
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Install native-codegen dependencies
        working-directory: packages/windows-fluent/rnw-fabric
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build source distribution and validate lifecycle contracts
        working-directory: packages/windows-fluent/rnw-fabric
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the isolated RNW public declaration snapshot
        run: node tooling/api-signatures.mjs --package packages/windows-fluent/rnw-fabric --snapshot docs/api-signatures-windows.json
      - name: Download the canonical shared package archives
        uses: actions/download-artifact@v4
        with:
          name: windows-fabric-shared-packages
          path: ${{ runner.temp }}/windows-shared
      - name: Install the fresh consumer from canonical peers and the Fabric candidate
        shell: pwsh
        run: |
          $consumer = Join-Path $env:RUNNER_TEMP "tron-windows-consumer"
          node packages/windows-fluent/rnw-fabric/scripts/prepare-consumer.mjs $consumer "$env:RUNNER_TEMP/windows-shared"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WIN_CONSUMER=$consumer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # RNW's MSBuild targets run `npx --yes --no-workspaces @react-native-community/cli`
      # with no version, which resolves the registry "latest" (cli 21.0.0 on
      # 2026-11-12 failed runs 43198587705 and 43200211081 with ETARGET).
      # Pinned to the example's cli version and reviewed 2026-11-12; reconsider
      # when RNW declares cli 21 or by 2026-12-12. The script exports
      # CodegenCommand, BundleCliCommand and AutolinkCommand, which MSBuild
      # reads as properties in every later build and run-windows step.
      - name: Pin and verify the RNW CLI major used by MSBuild
        shell: pwsh
        run: |
          node packages/windows-fluent/rnw-fabric/scripts/pin-rnw-cli.mjs $env:WIN_CONSUMER $env:GITHUB_ENV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate diagnostic scripts with the UIA PowerShell runtime
        working-directory: ${{ env.WIN_CONSUMER }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = Join-Path $env:RUNNER_TEMP "uia-smoke"
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $receipt = [ordered]@{
            schemaVersion = 1; sourceRevision = $env:GITHUB_SHA; status = "running"
            capturedAt = [DateTime]::UtcNow.ToString("o")
            powershellVersion = $PSVersionTable.PSVersion.ToString()
            powershellEdition = $PSVersionTable.PSEdition
            clrVersion = [Environment]::Version.ToString()
            processIs64Bit = [Environment]::Is64BitProcess
            productionCSharpCompilation = "not-run"
            ownedProcessTokenCheck = [ordered]@{ scope = "compatibility-process"; status = "not-run"; observation = $null; ownerGuard = "not-run" }
            scripts = [System.Collections.Generic.List[object]]::new()
            checks = [System.Collections.Generic.List[object]]::new()
          }
          $compatibilityFailure = $null
          try {
            if ($PSVersionTable.PSEdition -ne "Desktop" -or $PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1 -or -not [Environment]::Is64BitProcess) {
              throw "These checks must use the same Windows PowerShell 5.1 x64 runtime as native UIA"
            }
            foreach ($relative in @("scripts\uia-smoke.ps1", "scripts\uia-drag-input.ps1", "scripts\uia-drag-environment.ps1", "tests\native-drag-environment.test.ps1", "tests\native-drag-input.test.ps1", "tests\native-shell-identity.test.ps1")) {
              $path = (Resolve-Path -LiteralPath $relative).Path
              $tokens = $null; $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
              $receipt.scripts.Add(@{ path = $relative; sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant(); parseErrorCount = @($parseErrors).Count })
              if (@($parseErrors).Count -ne 0) { throw "Diagnostic script failed Windows PowerShell parsing: $relative" }
            }
            . .\scripts\uia-drag-environment.ps1
            Initialize-DragEnvironmentReader
            $receipt.productionCSharpCompilation = "passed"
            # Exercise the real read-only Win32 path against this process,
            # separately from the mock suites and later UIA app observations.
            $selfProcess = [System.Diagnostics.Process]::GetCurrentProcess()
            $tokenFailure = $null
            try {
              $receipt.ownedProcessTokenCheck.status = "failed"
              $selfToken = [NativeDragEnvironment]::Security($selfProcess.Handle, [uint32]$selfProcess.Id)
              $receipt.ownedProcessTokenCheck.observation = $selfToken
              if ($selfToken.status -ne "queried" -or $null -ne $selfToken.tokenCloseError) { throw "Could not query and close the owned process token" }
              foreach ($name in @("elevation", "elevationType", "integrityRid", "uiAccess")) {
                $field = $selfToken.fields[$name]
                if ($field.status -ne "observed" -or $null -eq $field.value) { throw "Actual owned-process token query failed: $name (status=$($field.status), Win32Error=$($field.win32Error))" }
              }
              # TOKEN_ELEVATION defines zero versus nonzero, not only 0 or 1.
              $receipt.ownedProcessTokenCheck.isElevated = $selfToken.fields["elevation"].value -ne 0
              if ($selfToken.fields["elevationType"].value -notin @(1, 2, 3)) { throw "TokenElevationType returned an invalid enum value" }
              # This checks the existing ownership guard and that querying did
              # not close the borrowed process handle. No other PID is opened.
              $wrongOwner = [NativeDragEnvironment]::Security($selfProcess.Handle, [uint32]($selfProcess.Id + 1))
              if ($wrongOwner.status -ne "owned-process-handle-mismatch" -or $wrongOwner.fields.Count -ne 0) { throw "Owned process token guard did not reject the mismatched expected PID" }
              $receipt.ownedProcessTokenCheck.ownerGuard = "passed"
              $receipt.ownedProcessTokenCheck.status = "passed"
              $receipt.checks.Add(@{ name = "native-owned-process-token-query"; status = "passed" })
              Write-Host "PASS: actual owned Windows process token reads and borrowed-handle ownership guard"
            } catch { $tokenFailure = $_; throw }
            finally {
              try { $selfProcess.Dispose() }
              catch {
                $receipt.ownedProcessTokenCheck.disposeErrorType = $_.Exception.GetType().FullName
                if ($null -eq $tokenFailure) { throw }
              }
            }
            # Mock suites own fake types; the native shell suite exercises real
            # self-token/SID guards. Separate 5.1 processes isolate their types.
            $engine = Join-Path $PSHOME "powershell.exe"
            foreach ($testName in @("native-drag-environment", "native-drag-input", "native-shell-identity")) {
              $resultDirectory = Join-Path $evidence $(if ($testName -eq "native-shell-identity") { $testName } else { "portable-" + $testName })
              & $engine -NoLogo -NoProfile -NonInteractive -File ".\tests\$testName.test.ps1" -OutputDirectory $resultDirectory
              $code = $LASTEXITCODE
              $receipt.checks.Add(@{ name = $testName; exitCode = $code; status = $(if ($code -eq 0) { "passed" } else { "failed" }) })
              if ($code -ne 0) { throw "Diagnostic regression failed: $testName (exit $code)" }
            }
            $receipt.status = "passed"
          } catch {
            $compatibilityFailure = $_
            $receipt.status = "failed"
            $receipt.error = @{ type = $_.Exception.GetType().FullName; message = $_.Exception.Message }
            throw
          } finally {
            try { $receipt | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 (Join-Path $evidence "diagnostic-compatibility.json") }
            catch {
              if ($null -eq $compatibilityFailure) { throw }
              Write-Host "Could not retain diagnostic compatibility receipt; primary failure remains unchanged."
            }
          }
      - name: Generate native code from the installed package
        working-directory: ${{ env.WIN_CONSUMER }}/node_modules/@nyc-tron/windows-fluent-fabric
        shell: pwsh
        run: |
          npm run codegen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($header in @("windows/NYCTronFluentFabric/codegen/react/components/NYCTronFluentFabric/TronNavigationView.g.h", "windows/NYCTronFluentFabric/codegen/NativeTronDesktopSpec.g.h", "windows/NYCTronFluentFabric/codegen/react/components/NYCTronFluentFabric/TronOverlayAnchor.g.h", "windows/NYCTronFluentFabric/codegen/react/components/NYCTronFluentFabric/TronDragSurface.g.h")) {
            if (-not (Test-Path $header)) { throw "Missing generated native header: $header" }
          }
      - name: Generate official RNW application and connect native package
        working-directory: ${{ env.WIN_CONSUMER }}
        shell: pwsh
        run: |
          npm run init:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run prepare:host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installed native C++/WinRT Fabric package
        working-directory: ${{ env.WIN_CONSUMER }}/node_modules/@nyc-tron/windows-fluent-fabric
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -version "[18.0,19.0)" -property installationPath
          if (-not $vs) { throw "Visual Studio 2026 required by RNW 0.85 is unavailable" }
          $msbuild = Join-Path $vs "MSBuild\Current\Bin\amd64\MSBuild.exe"
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          $installed = @(Get-ChildItem $sdkRoot -Directory | Where-Object { $_.Name -like '10.0.*' } | Sort-Object { [version]$_.Name } -Descending)
          if (-not $installed) { throw "No compatible Windows SDK installed on runner" }
          $sdkVersion = $installed[0].Name
          Write-Host "Using installed Windows SDK $sdkVersion instead of RNW's absent 10.0.22621.0"
          & $msbuild "windows\NYCTronFluentFabric.sln" "/p:Configuration=Release" "/p:Platform=x64" "/p:WindowsTargetPlatformVersion=$sdkVersion" "/p:UseExperimentalNuget=true" "/restore" "/m" "/v:minimal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The UIA smoke step below launches the packaged app and checks the
      # route roundtrip with keyboard input. It does not cover Narrator
      # speech, high contrast or an RTL locale. Native popup and OS mouse
      # drag checks are required below, including rejected/cancelled offers.

      - name: Compile actual Windows consumer executable
        working-directory: ${{ env.WIN_CONSUMER }}
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -version "[18.0,19.0)" -property installationPath
          if (-not $vs) { throw "Visual Studio 2026 required" }
          $msbuild = Join-Path $vs "MSBuild\Current\Bin\amd64\MSBuild.exe"
          $sdkRoot = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Windows Kits\10\Include"
          $sdk = Get-ChildItem $sdkRoot -Directory | Where-Object { $_.Name -like '10.0.*' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          # RNW app projects refuse to build outside a solution
          # (RequireSolution.targets needs SolutionPath/SolutionFileName).
          # Build the app's project target through its generated solution;
          # prepare:host has added the library project to that solution.
          & $msbuild "windows\NYCTronWindowsExample.sln" "/t:NYCTronWindowsExample" "/p:Configuration=Release" "/p:Platform=x64" "/p:WindowsTargetPlatformVersion=$($sdk.Name)" "/p:UseExperimentalNuget=true" "/p:RunAutolinkCheck=false" "/restore" "/m" "/v:minimal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem windows -Recurse -Filter NYCTronWindowsExample.exe | Select-Object -First 1
          if (-not $exe) { throw "Consumer executable was not produced" }
          Write-Host "Compiled Windows consumer: $($exe.FullName)"
          $map = Get-ChildItem windows -Recurse -Filter index.windows.bundle.packager.map | Select-Object -First 1
          if (-not $map) { throw "Release bundle source map was not produced" }
          node scripts/check-bundle-singletons.mjs $map.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Deploy the packaged consumer the way run-windows does
        working-directory: ${{ env.WIN_CONSUMER }}
        shell: pwsh
        run: |
          # RNW apps run with package identity; the bare executable exits
          # with 0xC0000409 on this runner. run-windows builds the .Package
          # project, enables Developer Mode and registers the layout.
          $sdkRoot = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Windows Kits\10\Include"
          $sdk = Get-ChildItem $sdkRoot -Directory | Where-Object { $_.Name -like '10.0.*' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          npx react-native run-windows --release --arch x64 --no-launch --no-packager --no-autolink --logging --msbuildprops "WindowsTargetPlatformVersion=$($sdk.Name),UseExperimentalNuget=true,RunAutolinkCheck=false"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = Get-AppxPackage -Name NYCTronWindowsExample
          if (-not $package) { throw "Packaged consumer was not registered" }
          Write-Host "Registered $($package.PackageFullName)"
          "CONSUMER_AUMID=$($package.PackageFamilyName)!App" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: UI Automation smoke test of the packaged consumer
        working-directory: ${{ env.WIN_CONSUMER }}
        shell: powershell
        run: |
          & .\scripts\uia-smoke.ps1 -AppUserModelId $env:CONSUMER_AUMID -ProcessName NYCTronWindowsExample -OutDir "$env:RUNNER_TEMP\uia-smoke"
      # T3: the packaged example in Start, All apps, search and on the taskbar.
      - name: Capture the packaged example in Start and on the taskbar
        if: ${{ !cancelled() && env.CONSUMER_AUMID != '' }}
        continue-on-error: true
        shell: powershell
        run: |
          & .\tooling\app-identity\capture\capture-windows.ps1 -AppUserModelId $env:CONSUMER_AUMID -OutDir "$env:RUNNER_TEMP\launcher-captures\windows-start" -IconPath "$env:GITHUB_WORKSPACE\packages\windows-fluent\rnw-fabric\example\assets\icon\windows\app.ico"
      - name: Save the launcher captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: launcher-captures-windows
          path: ${{ runner.temp }}/launcher-captures/
          if-no-files-found: warn
          retention-days: 30
      - name: Application Error records after a failed smoke test
        if: failure()
        shell: powershell
        run: |
          # The smoke driver itself can die (exit code -1073740940 in runs 42982441629 and 42985816081)
          # before it writes any record. Keep every Application Error/WER entry of the last 40 minutes,
          # whatever process faulted, so the faulting module is readable.
          $out = Join-Path $env:RUNNER_TEMP "uia-smoke"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $events = @(Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = (Get-Date).AddMinutes(-40); Id = 1000, 1001 } -MaxEvents 40 -ErrorAction SilentlyContinue)
          $lines = foreach ($e in $events) { "[{0}] id={1} {2}" -f $e.TimeCreated.ToUniversalTime().ToString("o"), $e.Id, ($e.Message -replace "\s+", " ") }
          [System.IO.File]::WriteAllLines((Join-Path $out "driver-crash-events.txt"), [string[]]@($lines))
          Write-Host "Application Error/WER records in the last 40 minutes: $($events.Count)"
          $lines | ForEach-Object { Write-Host $_.Substring(0, [Math]::Min(900, $_.Length)) }
      - name: Retain the exact package that passed native acceptance
        shell: pwsh
        run: |
          node packages/windows-fluent/rnw-fabric/scripts/retain-tested-package.mjs "$env:WIN_CONSUMER" "$env:RUNNER_TEMP\uia-smoke" "$env:RUNNER_TEMP\windows-fabric-tested-package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload tested Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: windows-fabric-tested-package
          path: ${{ runner.temp }}/windows-fabric-tested-package
          if-no-files-found: error
      - name: Upload UI Automation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winui-fabric-uia-smoke
          path: ${{ runner.temp }}/uia-smoke
          if-no-files-found: warn

  # Gate T4 measurement: which public @nyc-tron/ui exports build and render in
  # the React Native Windows 0.85 lane. Results are recorded per export and
  # component; a component that fails is data, not a job failure. Only harness
  # errors fail these jobs. They do not run when the release workflow calls
  # this file, so the release gate is unchanged.
  ui-coverage-inputs:
    name: UI desktop coverage inputs
    if: github.workflow != 'NYC-Tron release tarballs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Build and pack core, windows-fluent and ui with release provenance
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts
          corepack pnpm --filter @nyc-tron/core --filter @nyc-tron/windows-fluent --filter @nyc-tron/ui build
          node tooling/pack-release.mjs "$RUNNER_TEMP/ui-coverage-packs" --packages core,windows-fluent,ui
          node tooling/desktop-lane/synthesize-props.mjs packages/ui "$RUNNER_TEMP/ui-coverage-packs/nyc-tron-ui-$(node -p "require('./packages/ui/package.json').version").tgz" "$RUNNER_TEMP/ui-coverage-packs/props.json"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-coverage-inputs-windows
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/ui-coverage-packs/

  ui-coverage-windows:
    name: UI desktop coverage in the RNW 0.85 lane
    if: github.workflow != 'NYC-Tron release tarballs'
    needs: ui-coverage-inputs
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Install native-codegen dependencies
        working-directory: packages/windows-fluent/rnw-fabric
        run: npm install --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: desktop-ui-coverage-inputs-windows
          path: ${{ runner.temp }}/ui-coverage-packs
      - name: Prepare the archive-installed RNW consumer
        shell: pwsh
        run: |
          $consumer = Join-Path $env:RUNNER_TEMP "ui-coverage-consumer"
          node packages/windows-fluent/rnw-fabric/scripts/prepare-consumer.mjs $consumer "$env:RUNNER_TEMP/ui-coverage-packs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WIN_CONSUMER=$consumer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Generate native code and the official RNW application
        shell: pwsh
        run: |
          Push-Location "$env:WIN_CONSUMER/node_modules/@nyc-tron/windows-fluent-fabric"
          npm run codegen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location $env:WIN_CONSUMER
          npm run init:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run prepare:host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Install the ui archive and the coverage harness
        shell: pwsh
        run: |
          $version = node -p "require('./packages/ui/package.json').version"
          node tooling/desktop-lane/prepare-ui-coverage.mjs $env:WIN_CONSUMER "$env:RUNNER_TEMP/ui-coverage-packs/nyc-tron-ui-$version.tgz" --lane windows --props "$env:RUNNER_TEMP/ui-coverage-packs/props.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, bundle and deploy the packaged harness app
        working-directory: ${{ env.WIN_CONSUMER }}
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -version "[18.0,19.0)" -property installationPath
          if (-not $vs) { throw "Visual Studio 2026 required" }
          $msbuild = Join-Path $vs "MSBuild\Current\Bin\amd64\MSBuild.exe"
          $sdkRoot = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Windows Kits\10\Include"
          $sdk = Get-ChildItem $sdkRoot -Directory | Where-Object { $_.Name -like '10.0.*' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\ui-coverage-windows" | Out-Null
          & $msbuild "node_modules\@nyc-tron\windows-fluent-fabric\windows\NYCTronFluentFabric.sln" "/p:Configuration=Release" "/p:Platform=x64" "/p:WindowsTargetPlatformVersion=$($sdk.Name)" "/p:UseExperimentalNuget=true" "/restore" "/m" "/v:minimal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx react-native run-windows --release --arch x64 --no-launch --no-packager --no-autolink --logging --msbuildprops "WindowsTargetPlatformVersion=$($sdk.Name),UseExperimentalNuget=true,RunAutolinkCheck=false" *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\ui-coverage-windows\build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = Get-AppxPackage -Name NYCTronWindowsExample
          if (-not $package) { throw "Packaged harness was not registered" }
          "CONSUMER_AUMID=$($package.PackageFamilyName)!App" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Render every export in the native app
        shell: powershell
        run: |
          & .\tooling\desktop-lane\run-windows.ps1 -AppUserModelId $env:CONSUMER_AUMID -ProcessName NYCTronWindowsExample -OutDir "$env:RUNNER_TEMP\ui-coverage-windows\run"
      - name: Retain coverage evidence
        if: always()
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\ui-coverage-windows\run"
          New-Item -ItemType Directory -Force $out | Out-Null
          foreach ($file in @("preparation.json", "model.json", "resolution.jsonl")) {
            $source = Join-Path $env:WIN_CONSUMER "tron-ui-coverage\$file"
            if (Test-Path $source) { Copy-Item $source $out }
          }
          if (Test-Path "$env:WIN_CONSUMER\package-preparation.json") { Copy-Item "$env:WIN_CONSUMER\package-preparation.json" $out }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-ui-coverage-windows
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/ui-coverage-windows/
