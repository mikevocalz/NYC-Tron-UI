name: NYC-Tron release tarballs

# Builds every package, packs it, and attaches the .tgz files plus SHA256SUMS
# to a GitHub release. A tag with a hyphen (v1.0.0-rc.1) is a prerelease; a tag
# without one (v1.0.0) is the latest stable release. Consumers install the
# tarballs by release URL. Nothing is published to npm: every package.json
# stays "private": true.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to release, without the v (tag v<version> is created at the selected ref)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The release job needs the same gates a pull request needs: source tests,
  # typecheck, package and API-surface checks, component ledger, pack and
  # consumer smoke test, Windows compilation/UIA, Chromium acceptance suites,
  # reference captures/performance, installed UI/Expo consumers and native
  # compilation/runtime from those tarballs. Stable publication then requires
  # the complete accepted ledger and the actual owner's distribution review.
  ci:
    name: CI gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  ui-browser:
    name: UI browser acceptance
    uses: ./.github/workflows/ui-browser.yml
    permissions:
      contents: read
  menu-browser:
    name: overlay browser acceptance
    uses: ./.github/workflows/menu-browser.yml
    permissions:
      contents: read
  native-controls:
    name: packaged iOS and Android compilation and runtime
    uses: ./.github/workflows/native-controls-port.yml
    permissions:
      contents: read
  release-consumers:
    name: installed tarball consumers
    uses: ./.github/workflows/release-consumer.yml
    permissions:
      contents: read
  windows-native:
    name: Windows native compilation and UI Automation
    uses: ./.github/workflows/winui-fabric.yml
    permissions:
      contents: read
  native-feel:
    name: reference flows, captures and render measurements
    uses: ./.github/workflows/native-feel-preview.yml
    permissions:
      contents: read

  release:
    name: build, test, pack and upload
    needs: [ci, ui-browser, menu-browser, native-controls, release-consumers, windows-native, native-feel]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Enable corepack
        run: corepack enable

      - name: Resolve release version and tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a semver version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Install workspace (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile
      - name: Build every package
        run: corepack pnpm -r build
      - name: All unit, contract and mocked-render tests
        run: node tooling/run-tests.mjs
      - name: Typecheck against built packages
        run: corepack pnpm typecheck
      - name: Verify exports, dist targets and optional-peer isolation
        run: node tooling/verify-packages.mjs
      - name: Verify the public API surface
        run: node tooling/api-surface.mjs
      - name: Verify reachable public declarations and dependency type boundaries
        run: node tooling/api-signatures.mjs
      - name: Verify the complete component ledger and reviewed public exports
        run: node tooling/verify-component-program.mjs

      # Fails if any package version differs from the tag, a tarball lacks
      # dist/README/notices, ships src/, or keeps an export outside dist.
      - name: Pack and check every tarball
        run: node tooling/pack-release.mjs "$RUNNER_TEMP/release" --expect-version "${{ steps.version.outputs.version }}"
      - name: Install the dependency-free tarballs in a fresh project and import them
        run: node tooling/consumer-smoke.mjs "$RUNNER_TEMP/release"

      # @nyc-tron/windows-fluent-fabric is nested outside the pnpm workspace
      # because it pins RN 0.85 + react-native-windows 0.85, so pack-release
      # does not discover it. It ships src/ on purpose: RNW codegen reads the
      # typed spec through codegenConfig.jsSrcsDir when the consumer builds.
      - name: Pack the Windows Fabric NavigationView adapter
        working-directory: packages/windows-fluent/rnw-fabric
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          actual=$(node -p 'require("./package.json").version')
          if [ "$actual" != "$VERSION" ]; then echo "::error::windows-fluent-fabric version $actual does not match $VERSION"; exit 1; fi
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          node ../../../tooling/api-signatures.mjs --package . --snapshot ../../../docs/api-signatures-windows.json
          dir="$RUNNER_TEMP/release"
          file=$(npm pack --pack-destination "$dir" --silent | tail -n1)
          tar -tzf "$dir/$file" | grep -qx 'package/dist/index.js' || { echo "::error::dist missing from $file"; exit 1; }
          (cd "$dir" && sha256sum "$file" >> SHA256SUMS)
          cat "$dir/SHA256SUMS"

      # Preserve the concrete fourteen-archive candidate before D2/D3 can block
      # stable publication. The owner reviews these exact checksums, not a
      # hypothetical package inventory. This action does not create a release.
      - name: Retain the candidate archives and checksums for distribution review
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ steps.version.outputs.tag }}
          path: |
            ${{ runner.temp }}/release/*.tgz
            ${{ runner.temp }}/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Require actual stable-release acceptance and owner distribution review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: node tooling/release-readiness.mjs --version "$VERSION" --artifacts "$RUNNER_TEMP/release" --output "$RUNNER_TEMP/release/readiness.json"
      - name: Retain the readiness result, including blocked stable candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-${{ steps.version.outputs.tag }}
          path: ${{ runner.temp }}/release/readiness.json
          if-no-files-found: warn
          retention-days: 30

      - name: Create release and upload tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          dir="$RUNNER_TEMP/release"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; bump the package versions instead of replacing assets"
            exit 1
          fi
          # A hyphen in the tag (v1.0.0-rc.1, v0.1.0-alpha.5) marks a prerelease.
          case "$TAG" in
            *-*) channel=(--prerelease); kind="Prerelease" ;;
            *)   channel=(--latest);     kind="Release" ;;
          esac
          {
            echo "$kind $TAG. Install by URL, for example:"
            echo
            echo '```json'
            echo "\"@nyc-tron/ui\": \"https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/nyc-tron-ui-${TAG#v}.tgz\""
            echo '```'
            echo
            echo "Tarballs and SHA-256:"
            echo
            echo '```'
            cat "$dir/SHA256SUMS"
            echo '```'
            echo
            echo "Not published to npm. NYC-Tron original code is MIT. Ported code keeps its upstream license; see repository THIRD_PARTY_NOTICES.md and the notices included with each affected package."
            echo "Support tiers and what is not device-verified: docs/V1_DECISIONS.md."
          } > "$dir/NOTES.md"
          target=()
          if [ "$EVENT" = "workflow_dispatch" ]; then
            target=(--target "$GITHUB_SHA")
          else
            target=(--verify-tag)
          fi
          gh release create "$TAG" "${target[@]}" \
            "${channel[@]}" \
            --title "NYC-Tron UI $TAG" \
            --notes-file "$dir/NOTES.md" \
            "$dir"/*.tgz "$dir/SHA256SUMS"
          gh release view "$TAG" --json assets --jq '.assets[].name'
