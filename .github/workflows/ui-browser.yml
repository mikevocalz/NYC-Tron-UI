name: NYC-Tron rendered web instrument acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/ui/tests/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Install isolated browser test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise instruments, NativeSeekBar and content primitives in React Native Web
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-browser-captures
          path: |
            packages/ui/tests/browser/shots/
            packages/ui/tests/browser/test-results/
          retention-days: 7
