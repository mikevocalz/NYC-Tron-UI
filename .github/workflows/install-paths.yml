name: NYC-Tron Expo install paths

# Gate T4 item 1. Each job starts from a clean runner, creates an Expo app
# (new) or a default-template app that already has its own screens and
# native peers (existing), adds @nyc-tron/core and @nyc-tron/ui with one npm
# command, renders a Tron Button, and drives it on the platform. Native
# projects come only from `expo prebuild`. A failed install command is
# recorded as the result and fails the job.
#
# Archives: on a pull request, the packs job builds core and ui from the
# checked-out commit, so the jobs test the candidate's peer ranges. A manual
# run with a release tag installs that release's tarballs instead.
#
# Desktop lanes (V1_DECISIONS D5, decision 2 of 2026-11-12): the Spark and RNW
# hosts ship React Native below ui's >=0.88 floor. Their consumers install ui
# with npm and one scoped override, {"@nyc-tron/ui": {"react-native":
# "$react-native"}}, never --legacy-peer-deps, then build the native app and
# render Button, which is on both lanes' support lists.

on:
  pull_request:
    paths:
      - 'tooling/install-paths/**'
      - '.github/workflows/install-paths.yml'
  workflow_dispatch:
    inputs:
      release:
        description: Release tag whose tarballs the Expo jobs install (empty packs the checked-out commit)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: install-paths-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.release || '' }}
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  packs:
    name: Pack core, windows-fluent and ui from this commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Build, pack and synthesize the desktop harness props
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts
          corepack pnpm --filter @nyc-tron/core --filter @nyc-tron/windows-fluent --filter @nyc-tron/ui build
          node tooling/pack-release.mjs "$RUNNER_TEMP/packs" --packages core,windows-fluent,ui
          node tooling/desktop-lane/synthesize-props.mjs packages/ui "$RUNNER_TEMP/packs/nyc-tron-ui-$(node -p "require('./packages/ui/package.json').version").tgz" "$RUNNER_TEMP/packs/props.json"
      - uses: actions/upload-artifact@v4
        with:
          name: install-path-packs
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/packs/

  web:
    name: Web (${{ matrix.path }} Expo app)
    needs: packs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        path: [new, existing]
        include:
          # The existing app keeps the gesture handler its template pins
          # (~3.3.0); a second route renders GestureHandlerDrag with it.
          - path: existing
            extra: --gesture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@v4
        with:
          name: install-path-packs
          path: ${{ runner.temp }}/packs
      - name: Create the app and run the one install command
        run: |
          if [ -n "$RELEASE_TAG" ]; then source=(--release "$RELEASE_TAG"); else source=(--packs "$RUNNER_TEMP/packs"); fi
          node tooling/install-paths/install-path.mjs prepare ${{ matrix.path }} "$RUNNER_TEMP/ip/app" "${source[@]}" $EXTRA
        env:
          EXTRA: ${{ matrix.extra }}
      - name: Export for web
        working-directory: ${{ runner.temp }}/ip/app
        run: |
          npx --yes expo install react-dom react-native-web @expo/metro-runtime
          npx --no-install expo export --platform web --output-dir "$RUNNER_TEMP/ip/web"
      - name: Press the Tron button in Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/web-tools" && cd "$RUNNER_TEMP/web-tools"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.65.0 serve-handler@6.1.6
          npx --no-install playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          web="$RUNNER_TEMP/ip/web"; [ -d "$web/client" ] && web="$web/client"
          route=/; [ "${{ matrix.path }}" = existing ] && route=/tron
          T4_WEB_TOOLS="$RUNNER_TEMP/web-tools" node tooling/install-paths/web-check.mjs "$web" "$RUNNER_TEMP/ip/web.png" "$route" | tee "$RUNNER_TEMP/ip/web-check.json"
          if [ "${{ matrix.path }}" = existing ]; then
            T4_WEB_TOOLS="$RUNNER_TEMP/web-tools" node tooling/install-paths/web-check.mjs "$web" "$RUNNER_TEMP/ip/web-gesture.png" /gesture | tee "$RUNNER_TEMP/ip/web-check-gesture.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-path-web-${{ matrix.path }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/ip/*.json
            ${{ runner.temp }}/ip/*.log
            ${{ runner.temp }}/ip/*.png
            ${{ runner.temp }}/ip/app/package.json
            ${{ runner.temp }}/ip/app/package-lock.json

  ios:
    name: iOS simulator (${{ matrix.path }} Expo app)
    needs: packs
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        path: [new, existing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: install-path-packs
          path: ${{ runner.temp }}/packs
      - name: Create the app and run the one install command
        run: |
          if [ -n "$RELEASE_TAG" ]; then source=(--release "$RELEASE_TAG"); else source=(--packs "$RUNNER_TEMP/packs"); fi
          node tooling/install-paths/install-path.mjs prepare ${{ matrix.path }} "$RUNNER_TEMP/ip/app" "${source[@]}" $EXTRA
        env:
          EXTRA: ${{ matrix.extra }}
      - name: Generate the native project with prebuild only
        working-directory: ${{ runner.temp }}/ip/app
        run: npx --no-install expo prebuild --platform ios --non-interactive
      - name: Build a Release simulator app (JavaScript embedded)
        working-directory: ${{ runner.temp }}/ip/app/ios
        run: |
          set -o pipefail
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/ip/derived" -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/ip/xcodebuild.log" | grep -E '^(\*\*|error:)' || true
          test -n "$(find "$RUNNER_TEMP/ip/derived/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)"
      - name: Boot a simulator, install, press the button
        env:
          # Run 43198587954 (new app): the XCTest driver missed Maestro's
          # default startup window on a freshly booted simulator.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
        run: |
          node tooling/native/install-maestro.mjs "$RUNNER_TEMP/maestro"
          # A device of our own on the newest installed iOS runtime. The first
          # boot of a new runtime can exceed seven minutes on a hosted runner.
          # Pick a phone the runtime itself lists as supported; a newer phone
          # than the runtime fails with "Incompatible device" (run 43175458694).
          read runtime type < <(xcrun simctl list runtimes available -j | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8")).runtimes.filter(r=>r.platform==="iOS").sort((a,b)=>a.version.localeCompare(b.version,undefined,{numeric:true})).pop();const p=(r.supportedDeviceTypes||[]).filter(t=>/^iPhone/.test(t.name));const t=p.filter(t=>/^iPhone \d+$/.test(t.name)).pop()||p.filter(t=>/^iPhone \d+/.test(t.name)).pop()||p.pop();console.log(r.identifier,t.identifier)')
          udid=$(xcrun simctl create "T4 iPhone" "$type" "$runtime")
          echo "$runtime $type $udid" | tee "$RUNNER_TEMP/ip/simulator.txt"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          app=$(find "$RUNNER_TEMP/ip/derived/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          xcrun simctl install "$udid" "$app"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          scheme=$(node -p "require('$RUNNER_TEMP/ip/app/app.json').expo.scheme || ''")
          node tooling/install-paths/flow.mjs "$bundle" "${{ matrix.path }}" "$scheme" > "$RUNNER_TEMP/ip/flow.yaml"
          cd "$RUNNER_TEMP/ip"  # takeScreenshot writes to the working directory
          "$RUNNER_TEMP/maestro/maestro/bin/maestro" --device "$udid" test "$RUNNER_TEMP/ip/flow.yaml" --test-output-dir "$RUNNER_TEMP/ip/maestro"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-path-ios-${{ matrix.path }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/ip/*.json
            ${{ runner.temp }}/ip/*.log
            ${{ runner.temp }}/ip/flow.yaml
            ${{ runner.temp }}/ip/*.png
            ${{ runner.temp }}/ip/simulator.txt
            ${{ runner.temp }}/ip/maestro/
            ${{ runner.temp }}/ip/app/package.json
            ${{ runner.temp }}/ip/app/package-lock.json

  android:
    name: Android emulator (${{ matrix.path }} Expo app)
    needs: packs
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        path: [new, existing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: install-path-packs
          path: ${{ runner.temp }}/packs
      - name: Create the app and run the one install command
        run: |
          if [ -n "$RELEASE_TAG" ]; then source=(--release "$RELEASE_TAG"); else source=(--packs "$RUNNER_TEMP/packs"); fi
          node tooling/install-paths/install-path.mjs prepare ${{ matrix.path }} "$RUNNER_TEMP/ip/app" "${source[@]}" $EXTRA
        env:
          EXTRA: ${{ matrix.extra }}
      - name: Generate the native project with prebuild only
        working-directory: ${{ runner.temp }}/ip/app
        run: npx --no-install expo prebuild --platform android --non-interactive
      - name: Build a release APK (JavaScript embedded, debug-signed by the template)
        working-directory: ${{ runner.temp }}/ip/app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Prepare the flow and test driver
        run: |
          node tooling/native/install-maestro.mjs "$RUNNER_TEMP/maestro"
          package=$(node -p "require('$RUNNER_TEMP/ip/app/app.json').expo.android?.package || ''")
          [ -z "$package" ] && package=$(grep -m1 "applicationId" "$RUNNER_TEMP/ip/app/android/app/build.gradle" | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          scheme=$(node -p "require('$RUNNER_TEMP/ip/app/app.json').expo.scheme || ''")
          node tooling/install-paths/flow.mjs "$package" "${{ matrix.path }}" "$scheme" > "$RUNNER_TEMP/ip/flow.yaml"
      - name: Install on an emulator and press the button
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r "$(find $RUNNER_TEMP/ip/app/android/app/build/outputs/apk/release -name '*.apk' | head -1)"
            cd $RUNNER_TEMP/ip && $RUNNER_TEMP/maestro/maestro/bin/maestro test $RUNNER_TEMP/ip/flow.yaml --test-output-dir $RUNNER_TEMP/ip/maestro
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-path-android-${{ matrix.path }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/ip/*.json
            ${{ runner.temp }}/ip/*.log
            ${{ runner.temp }}/ip/flow.yaml
            ${{ runner.temp }}/ip/*.png
            ${{ runner.temp }}/ip/maestro/
            ${{ runner.temp }}/ip/app/package.json
            ${{ runner.temp }}/ip/app/package-lock.json

  desktop-macos:
    name: macOS (Spark 0.0.3) npm install with the scoped override, Button rendered
    needs: packs
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SPARK_XCODEBUILD_JOBS: '3'
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@v4
        with:
          name: install-path-packs
          path: ${{ runner.temp }}/packs
      - name: Prepare the Spark consumer with the test driver
        run: node tooling/macos-appkit/prepare-consumer.mjs "$RUNNER_TEMP/consumer" --native-acceptance --shared-archives "$RUNNER_TEMP/packs"
      - name: npm install ui with the scoped react-native override; harness renders Button only
        run: node tooling/desktop-lane/prepare-ui-coverage.mjs "$RUNNER_TEMP/consumer" "$RUNNER_TEMP/packs/nyc-tron-ui-$(node -p "require('./packages/ui/package.json').version").tgz" --lane macos --props "$RUNNER_TEMP/packs/props.json" --install npm --only ./components/Button
      - name: Build the standalone app
        working-directory: ${{ runner.temp }}/consumer
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ip"
          npm run build 2>&1 | tee "$RUNNER_TEMP/ip/build.log"
      - name: Render Button in the native app
        run: |
          node tooling/desktop-lane/run-macos.mjs "$RUNNER_TEMP/consumer" "$RUNNER_TEMP/ip/run"
          node tooling/install-paths/desktop-render-check.mjs "$RUNNER_TEMP/ip/run" ./components/Button Button "$RUNNER_TEMP/ip/record.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-path-spark-0.0.3-macos
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/ip/record.json
            ${{ runner.temp }}/ip/run/
            ${{ runner.temp }}/consumer/package.json
            ${{ runner.temp }}/consumer/package-lock.json

  desktop-windows:
    name: Windows (RNW 0.85) npm install with the scoped override, Button rendered
    needs: packs
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install native-codegen dependencies
        working-directory: packages/windows-fluent/rnw-fabric
        run: npm install --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: install-path-packs
          path: ${{ runner.temp }}/packs
      - name: Prepare the RNW consumer
        shell: pwsh
        run: |
          $consumer = Join-Path $env:RUNNER_TEMP "consumer"
          node packages/windows-fluent/rnw-fabric/scripts/prepare-consumer.mjs $consumer "$env:RUNNER_TEMP/packs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WIN_CONSUMER=$consumer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Generate native code and the official RNW application
        shell: pwsh
        run: |
          Push-Location "$env:WIN_CONSUMER/node_modules/@nyc-tron/windows-fluent-fabric"
          npm run codegen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location $env:WIN_CONSUMER
          npm run init:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run prepare:host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: npm install ui with the scoped react-native override; harness renders Button only
        shell: pwsh
        run: |
          $version = node -p "require('./packages/ui/package.json').version"
          node tooling/desktop-lane/prepare-ui-coverage.mjs $env:WIN_CONSUMER "$env:RUNNER_TEMP/packs/nyc-tron-ui-$version.tgz" --lane windows --props "$env:RUNNER_TEMP/packs/props.json" --install npm --only ./components/Button
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, bundle and deploy the packaged app
        working-directory: ${{ env.WIN_CONSUMER }}
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -version "[18.0,19.0)" -property installationPath
          if (-not $vs) { throw "Visual Studio 2026 required" }
          $msbuild = Join-Path $vs "MSBuild\Current\Bin\amd64\MSBuild.exe"
          $sdkRoot = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Windows Kits\10\Include"
          $sdk = Get-ChildItem $sdkRoot -Directory | Where-Object { $_.Name -like '10.0.*' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\ip" | Out-Null
          & $msbuild "node_modules\@nyc-tron\windows-fluent-fabric\windows\NYCTronFluentFabric.sln" "/p:Configuration=Release" "/p:Platform=x64" "/p:WindowsTargetPlatformVersion=$($sdk.Name)" "/p:UseExperimentalNuget=true" "/restore" "/m" "/v:minimal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx react-native run-windows --release --arch x64 --no-launch --no-packager --no-autolink --logging --msbuildprops "WindowsTargetPlatformVersion=$($sdk.Name),UseExperimentalNuget=true,RunAutolinkCheck=false" *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\ip\build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = Get-AppxPackage -Name NYCTronWindowsExample
          if (-not $package) { throw "Packaged app was not registered" }
          "CONSUMER_AUMID=$($package.PackageFamilyName)!App" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Render Button in the native app
        shell: powershell
        run: |
          & .\tooling\desktop-lane\run-windows.ps1 -AppUserModelId $env:CONSUMER_AUMID -ProcessName NYCTronWindowsExample -OutDir "$env:RUNNER_TEMP\ip\run"
      - name: Check the render
        if: always()
        shell: pwsh
        run: |
          $run = "$env:RUNNER_TEMP\ip\run"
          New-Item -ItemType Directory -Force $run | Out-Null
          foreach ($file in @("preparation.json", "model.json", "resolution.jsonl")) {
            $source = Join-Path $env:WIN_CONSUMER "tron-ui-coverage\$file"
            if (Test-Path $source) { Copy-Item $source $run }
          }
          node tooling/install-paths/desktop-render-check.mjs $run ./components/Button Button "$env:RUNNER_TEMP\ip\record.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-path-rnw-0.85-windows
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/ip/record.json
            ${{ runner.temp }}/ip/run/
            ${{ env.WIN_CONSUMER }}/package.json
            ${{ env.WIN_CONSUMER }}/package-lock.json
