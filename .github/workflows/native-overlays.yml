name: NYC-Tron native overlays

# Compiles the example app that renders NativeDropdown, NativeActionMenu,
# NativePopover and Tooltip, so Gradle and Xcode link every @expo/ui Compose
# and SwiftUI view those components use. A green run proves the native code
# builds. It does not prove on-device placement, gestures or screen-reader
# behavior.
on:
  pull_request:
    paths:
      - "packages/expo-controls/**"
      - "packages/ui/**"
      - "examples/native-overlays/**"
      - ".github/workflows/native-overlays.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - "packages/expo-controls/**"
      - "packages/ui/**"
      - "examples/native-overlays/**"
      - ".github/workflows/native-overlays.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android Compose overlays compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: corepack pnpm build
      - name: Generate the Android project
        run: corepack pnpm --dir examples/native-overlays exec expo prebuild --platform android --no-install --non-interactive
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
      - name: Gradle debug build (Kotlin and Compose)
        working-directory: examples/native-overlays/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

  ios:
    name: iOS SwiftUI overlays simulator compile
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: corepack pnpm build
      - name: Generate the iOS project
        run: corepack pnpm --dir examples/native-overlays exec expo prebuild --platform ios --no-install --non-interactive
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
      - name: Install pods
        working-directory: examples/native-overlays/ios
        run: pod install
      - name: Build for the iOS simulator without code signing
        working-directory: examples/native-overlays/ios
        run: |
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if [ -z "$workspace" ]; then echo "Missing iOS workspace"; exit 1; fi
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
