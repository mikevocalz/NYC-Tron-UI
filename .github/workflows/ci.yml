name: NYC-Tron source, exports and types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    name: pure contracts and dependency boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: node --test packages/core/tests/*.test.mjs packages/geometry/tests/*.test.mjs packages/ui/tests/*.test.mjs packages/expo-controls/tests/*.test.mjs packages/native-charts/tests/*.test.mjs packages/icons/tests/*.test.js packages/windows-fluent/tests/*.test.mjs

  types:
    name: workspace TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Enable corepack
        run: corepack enable
      - name: Install local workspace
        run: corepack pnpm install --frozen-lockfile
      - name: Compile independent package distributions in dependency order
        run: corepack pnpm build
      - name: Typecheck packages against built peer workspaces
        run: corepack pnpm typecheck
      - name: Render adaptive pane component contracts with mocked native hosts
        run: node --test packages/panes/tests/*.test.mjs
      # Uses the installed typescript to run the hooks under mocked RN/Expo.
      - name: Reserved-regions native contracts and hook behavior
        run: node --test packages/reserved-regions/tests/*.test.mjs
      - name: Platform-services native contracts and service behavior
        run: node --experimental-strip-types --test packages/platform-services/tests/*.test.mjs
      - name: Render Forge control contracts with mocked native hosts
        run: node --test packages/ui/tests/render/*.test.mjs
      - name: Verify distributable subpaths and dependency boundaries
        run: node tooling/verify-packages.mjs
      - name: Pack every package and check release tarball contents
        run: node tooling/pack-release.mjs /tmp/nyc-tron-packs
      # No native targets are built on this Linux workflow. A typechecked
      # @expo/ui source import is not a device validation.
