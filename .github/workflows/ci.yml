name: NYC-Tron source, exports and types

on:
  pull_request:
  push:
    branches: [main]
  # release.yml calls this workflow so a tag cannot ship without these gates.
  workflow_call:

permissions:
  contents: read

jobs:
  source:
    name: pure contracts and dependency boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Install source-test tooling
        run: corepack enable && corepack pnpm install --frozen-lockfile --ignore-scripts
      # One test list for CI, release and `pnpm test`: tooling/test-files.mjs.
      - name: Build packages the tests import
        run: corepack pnpm build
      - name: All unit, contract and mocked-render tests
        run: node tooling/run-tests.mjs

  # Apple launcher labels are measured with AppKit's system font, so this job
  # runs on macOS. No install: the app-identity tools have no dependencies.
  app-identity:
    name: app icons and launcher label widths
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Icons are current and every example passes the launcher check
        run: node --test tooling/tests/app-identity.test.mjs
      - name: Launcher check on every example config (measured targets must fit)
        run: >-
          node tooling/app-identity/launcher-label-check.mjs
          examples/native-instruments/app.json
          examples/macos-appkit/spark/desktop.config.json
          packages/windows-fluent/rnw-fabric/example/app.json
      - name: The check rejects a long name with its measured overflow
        shell: bash
        run: |
          set +e
          node tooling/app-identity/launcher-label-check.mjs --name "NYC-Tron Instruments Demo" --platforms ios,android
          code=$?
          set -e
          test "$code" -eq 1

  types:
    name: workspace TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Enable corepack
        run: corepack enable
      - name: Install local workspace
        run: corepack pnpm install --frozen-lockfile
      - name: Compile independent package distributions in dependency order
        run: corepack pnpm build
      - name: Typecheck packages against built peer workspaces
        run: corepack pnpm typecheck
      - name: Verify distributable subpaths and dependency boundaries
        run: node tooling/verify-packages.mjs
      - name: Verify the public API surface against docs/api-surface.json
        run: node tooling/api-surface.mjs
      - name: Verify reachable public declarations and dependency type boundaries
        run: node tooling/api-signatures.mjs
      - name: Verify the complete component ledger and reviewed public exports
        run: node tooling/verify-component-program.mjs
      - name: Pack every package and check release tarball contents
        run: node tooling/pack-release.mjs "$RUNNER_TEMP/nyc-tron-packs"
      - name: Install the dependency-free tarballs in a fresh project and import them
        run: node tooling/consumer-smoke.mjs "$RUNNER_TEMP/nyc-tron-packs"
      # No native targets are built on this Linux workflow. A typechecked
      # @expo/ui source import is not a device validation.

  # Path-separator and shell differences only show up on Windows, so run the
  # same test list and the same pack checks there. winui-*.yml cover the
  # native Windows builds and are not touched.
  windows:
    name: tests and pack on Windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Enable corepack
        run: corepack enable
      - name: Install local workspace
        run: corepack pnpm install --frozen-lockfile
      - name: Build every package
        run: corepack pnpm build
      - name: All unit, contract and mocked-render tests
        run: node tooling/run-tests.mjs
      - name: Verify distributable subpaths and dependency boundaries
        run: node tooling/verify-packages.mjs
      - name: Pack every package and check release tarball contents
        run: node tooling/pack-release.mjs "$env:RUNNER_TEMP\nyc-tron-packs"
      - name: Install the dependency-free tarballs in a fresh project and import them
        run: node tooling/consumer-smoke.mjs "$env:RUNNER_TEMP\nyc-tron-packs"
