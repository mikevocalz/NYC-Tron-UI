name: NYC-Tron source, exports and types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    name: pure contracts and dependency boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: node --test packages/core/tests/*.test.mjs packages/geometry/tests/*.test.mjs packages/ui/tests/*.test.mjs packages/icons/tests/*.test.js

  types:
    name: workspace TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Enable corepack
        run: corepack enable
      - name: Install local workspace
        run: corepack pnpm install --frozen-lockfile
      - name: Typecheck packages
        run: corepack pnpm typecheck
      - name: Compile independent package distributions
        run: corepack pnpm build
      - name: Verify distributable subpaths and dependency boundaries
        run: node tooling/verify-packages.mjs
      - name: Inspect npm tarball contents
        run: |
          mkdir -p /tmp/nyc-tron-packs
          corepack pnpm --dir packages/core pack --pack-destination /tmp/nyc-tron-packs
          corepack pnpm --dir packages/geometry pack --pack-destination /tmp/nyc-tron-packs
          corepack pnpm --dir packages/ui pack --pack-destination /tmp/nyc-tron-packs
          corepack pnpm --dir packages/icons pack --pack-destination /tmp/nyc-tron-packs
          tar -tzf /tmp/nyc-tron-packs/nyc-tron-icons-*.tgz | grep 'package/src/glyphs.js'
          tar -tzf /tmp/nyc-tron-packs/nyc-tron-icons-*.tgz | grep 'package/src/TronIcon.js'
          tar -tzf /tmp/nyc-tron-packs/nyc-tron-icons-*.tgz > /tmp/nyc-tron-icons-files.txt
          for f in src/TronIcon.d.ts src/index.d.ts src/glyphs.d.ts src/tokens.d.ts THIRD_PARTY_NOTICES.md README.md; do
            grep -qx "package/$f" /tmp/nyc-tron-icons-files.txt || { echo "missing $f"; exit 1; }
          done
          ls -lh /tmp/nyc-tron-packs/*.tgz
      # No native targets are built on this Linux workflow. A typechecked
      # @expo/ui source import is not a device validation.
