name: NYC-Tron rendered web menu acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/expo-controls/tests/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Install isolated browser test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise the rendered RN web menu
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: menu-browser-failure
          path: packages/expo-controls/tests/browser/test-results/
          retention-days: 7
